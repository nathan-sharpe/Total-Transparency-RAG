# CI: every push proves the repo still works and retrieval hasn't regressed.
#
# Two tiers run here:
#   1. ruff + pytest (fast, deterministic)
#   2. the Tier-1 retrieval eval against a real Postgres/pgvector service
#      container, ingested with the CPU embedding profile
#      (EMBEDDING_PROFILE=sentence-transformers) — this is where the pluggable
#      embedder interface pays off. A gate step fails the build if recall@5
#      drops below RECALL5_FLOOR.
#
# CI runs the same sentence-transformers profile the system ships, so the gate
# guards the real retrieval path. The floor is a regression tripwire set below
# the measured recall@5, not the portfolio figure (full methodology lives in
# EVALS.md); the gate passes --expect-profile so an accidental profile swap
# fails loudly instead of being silently scored.

name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch supersedes the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Regression floor for recall@5 under the sentence-transformers profile.
  # CI ingests at the Phase 6 shipped config (MiniLM, 300/60 chunking, 5,827
  # chunks) since it inherits the config.py chunk defaults. Latest full-corpus
  # CPU ingest measured recall@5 = 0.751 (2026-07-22, run 29889385589) — the
  # floor sits ~7 points below so it trips on real regressions (broken chunking,
  # mangled query path), not minor drift. It was first calibrated 2026-07-18 at
  # 0.68 against the then-default 200/40 corpus (recall@5 0.7209); the profile
  # switch raised the measured number but the conservative floor still holds, so
  # it was left unchanged. Recalibrate if the embedding profile, corpus, or
  # chunk params change again.
  RECALL5_FLOOR: "0.68"

jobs:
  ci:
    runs-on: ubuntu-24.04

    services:
      db:
        # Same pinned image as docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          # Throwaway credentials for the job-scoped service container — not
          # secrets. Must match the job env below (services can't read job env).
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag-ci
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-ci
      POSTGRES_DB: rag
      DB_HOST: localhost
      DB_PORT: "5432"
      EMBEDDING_PROFILE: sentence-transformers
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cpu.txt

      # The SciFact zip (rag/datasets.py) and the MiniLM weights (Hugging Face)
      # are both immutable downloads — cache them across runs.
      - name: Cache SciFact dataset
        uses: actions/cache@v4
        with:
          path: data
          key: beir-scifact-v1

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: |
          # PyPI's Linux torch wheels bundle CUDA (several GB); this runner has
          # no GPU. Installing the CPU wheel first means requirements-cpu.txt
          # finds its torch pin already satisfied and skips the CUDA build.
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      # Full 5.2K-doc corpus (not a --limit subset): keeps the CI number on the
      # same corpus as EVALS.md methodology, differing only by embedding
      # profile. Measured 2026-07-18: ~11 min for this step, ~12.5 min total —
      # the roadmap's ~10-minute guidance is knowingly exceeded in exchange for
      # comparability (a subset would also force floor recalibration).
      - name: Ingest corpus (CPU profile)
        run: python ingest.py --dataset scifact

      - name: Retrieval eval
        run: python evals/run_retrieval.py

      - name: Retrieval regression gate
        run: >-
          python evals/check_retrieval_gate.py
          --floor "$RECALL5_FLOOR"
          --expect-profile sentence-transformers

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: evals/results/retrieval.json
          if-no-files-found: ignore
