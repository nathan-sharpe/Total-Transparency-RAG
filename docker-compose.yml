services:
  api:
    build: .
    restart: unless-stopped
    # .env supplies the shared config (DB credentials etc.); the environment
    # block then overrides only the values that differ *inside* a container,
    # so one .env serves both host-run scripts and the container.
    env_file: .env
    environment:
      DB_HOST: db                                    # compose service name, not localhost
      OLLAMA_URL: http://host.docker.internal:11434  # Ollama stays native on the host
      API_HOST: 0.0.0.0                              # bind beyond the container loopback
      API_PORT: "8000"                               # container-internal port (host side maps below)
      LOG_DIR: /app/logs
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Bind mount (not a named volume) for logs: low write volume, and the
      # files stay browsable from the host. Persists beyond `compose down`.
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    # Pinned tag per project rules.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # ${VAR:?...} makes compose fail with a clear message if .env is missing a value,
      # instead of silently starting a database with no password.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume rather than a host-folder bind mount: Postgres data on a
      # Windows/NTFS bind mount is slow and permission-fragile. A named volume
      # still persists across `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
